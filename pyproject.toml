[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "european-parliamentary-ai-study"
version = "0.1.0"
description = "Reproducible multilingual parliamentary AI-writing study"
requires-python = ">=3.11"
dependencies = ["pypdf==6.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
